<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" aria-labelledby="title desc" role="img" viewBox="0 0 1280 820"><title id="title">rocketmq-observability global design architecture</title><desc id="desc">Architecture diagram showing application components, observability configuration, telemetry signals, OpenTelemetry runtime providers, exporters, and shutdown lifecycle.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#314155" d="M0,0 L0,6 L9,3 z"/></marker><style>.canvas{fill:#f7f9fc}.group{fill:#fff;stroke:#c8d2df;stroke-width:1.4;rx:18}.group-title{fill:#314155;font:700 18px Arial,sans-serif}.box{fill:#eef5ff;stroke:#7398c6;stroke-width:1.4;rx:10}.box.alt{fill:#f0f9f3;stroke:#6da77e}.box.signal{fill:#fff6e8;stroke:#c79348}.box.exporter{fill:#f6efff;stroke:#9b7bc8}.box.lifecycle{fill:#fff0f0;stroke:#cf7777}.label{fill:#1f2937;font:600 16px Arial,sans-serif}.small{fill:#4b5563;font:13px Arial,sans-serif}.arrow,.muted-arrow{fill:none;stroke:#314155;stroke-width:1.7;marker-end:url(#arrow)}.muted-arrow{stroke:#748296;stroke-width:1.4;stroke-dasharray:5 5}</style></defs><rect width="1280" height="820" x="0" y="0" class="canvas"/><text x="640" y="42" class="group-title" text-anchor="middle">rocketmq-observability Global Design</text><text x="640" y="66" class="small" text-anchor="middle">Shared configuration, lifecycle, signals, propagation, OpenTelemetry runtime, and exporters</text><rect width="250" height="590" x="40" y="105" class="group"/><text x="165" y="135" class="group-title" text-anchor="middle">RocketMQ Components</text><rect width="180" height="58" x="75" y="165" class="box"/><text x="165" y="189" class="label" text-anchor="middle">Application</text><text x="165" y="209" class="small" text-anchor="middle">or embedding process</text><rect width="180" height="58" x="75" y="260" class="box"/><text x="165" y="284" class="label" text-anchor="middle">Broker</text><text x="165" y="304" class="small" text-anchor="middle">business metrics</text><rect width="180" height="58" x="75" y="345" class="box"/><text x="165" y="369" class="label" text-anchor="middle">Client</text><text x="165" y="389" class="small" text-anchor="middle">send / consume / rebalance</text><rect width="180" height="58" x="75" y="430" class="box"/><text x="165" y="454" class="label" text-anchor="middle">Store / Remoting</text><text x="165" y="474" class="small" text-anchor="middle">latency and requests</text><rect width="180" height="58" x="75" y="515" class="box"/><text x="165" y="539" class="label" text-anchor="middle">Namesrv / Controller</text><text x="165" y="559" class="small" text-anchor="middle">route and cluster state</text><rect width="180" height="58" x="75" y="600" class="box"/><text x="165" y="624" class="label" text-anchor="middle">Proxy</text><text x="165" y="644" class="small" text-anchor="middle">gRPC and forwarding</text><rect width="255" height="230" x="335" y="105" class="group"/><text x="462" y="135" class="group-title" text-anchor="middle">Configuration</text><rect width="180" height="58" x="372" y="165" class="box alt"/><text x="462" y="189" class="label" text-anchor="middle">ObservabilityConfig</text><text x="462" y="209" class="small" text-anchor="middle">signals and exporters</text><rect width="180" height="58" x="372" y="252" class="box alt"/><text x="462" y="276" class="label" text-anchor="middle">init_observability</text><text x="462" y="296" class="small" text-anchor="middle">validate and initialize</text><rect width="255" height="315" x="335" y="380" class="group"/><text x="462" y="410" class="group-title" text-anchor="middle">Telemetry APIs</text><rect width="180" height="50" x="372" y="440" class="box signal"/><text x="462" y="471" class="label" text-anchor="middle">metrics::*</text><rect width="180" height="50" x="372" y="505" class="box signal"/><text x="462" y="536" class="label" text-anchor="middle">trace::*</text><rect width="180" height="50" x="372" y="570" class="box signal"/><text x="462" y="601" class="label" text-anchor="middle">propagation::*</text><rect width="180" height="50" x="372" y="635" class="box signal"/><text x="462" y="666" class="label" text-anchor="middle">logs::bridge</text><rect width="270" height="590" x="640" y="105" class="group"/><text x="775" y="135" class="group-title" text-anchor="middle">OpenTelemetry Runtime</text><rect width="190" height="58" x="680" y="165" class="box"/><text x="775" y="189" class="label" text-anchor="middle">Resource</text><text x="775" y="209" class="small" text-anchor="middle">service and RocketMQ metadata</text><rect width="190" height="58" x="680" y="260" class="box"/><text x="775" y="284" class="label" text-anchor="middle">SdkMeterProvider</text><text x="775" y="304" class="small" text-anchor="middle">metrics instruments</text><rect width="190" height="58" x="680" y="360" class="box"/><text x="775" y="384" class="label" text-anchor="middle">SdkTracerProvider</text><text x="775" y="404" class="small" text-anchor="middle">spans and context</text><rect width="190" height="58" x="680" y="460" class="box"/><text x="775" y="484" class="label" text-anchor="middle">SdkLoggerProvider</text><text x="775" y="504" class="small" text-anchor="middle">OpenTelemetry logs</text><rect width="190" height="58" x="680" y="560" class="box"/><text x="775" y="584" class="label" text-anchor="middle">tracing subscriber</text><text x="775" y="604" class="small" text-anchor="middle">trace and log layers</text><rect width="260" height="390" x="960" y="105" class="group"/><text x="1090" y="135" class="group-title" text-anchor="middle">Exporters</text><rect width="190" height="58" x="995" y="170" class="box exporter"/><text x="1090" y="194" class="label" text-anchor="middle">stdout / log</text><text x="1090" y="214" class="small" text-anchor="middle">local inspection</text><rect width="190" height="58" x="995" y="270" class="box exporter"/><text x="1090" y="294" class="label" text-anchor="middle">OTLP gRPC</text><text x="1090" y="314" class="small" text-anchor="middle">collector endpoint</text><rect width="190" height="58" x="995" y="370" class="box exporter"/><text x="1090" y="394" class="label" text-anchor="middle">Prometheus</text><text x="1090" y="414" class="small" text-anchor="middle">HTTP scrape endpoint</text><rect width="260" height="145" x="960" y="550" class="group"/><text x="1090" y="580" class="group-title" text-anchor="middle">Lifecycle</text><rect width="190" height="58" x="995" y="610" class="box lifecycle"/><text x="1090" y="634" class="label" text-anchor="middle">TelemetryGuard</text><text x="1090" y="654" class="small" text-anchor="middle">shutdown providers and HTTP</text><path d="M255,194 C300,194 315,194 372,194" class="arrow"/><path d="M462,223 L462,252" class="arrow"/><path d="M552,281 C590,281 620,194 680,194" class="arrow"/><path d="M552,281 C610,281 625,289 680,289" class="arrow"/><path d="M552,281 C610,281 625,389 680,389" class="arrow"/><path d="M552,281 C610,281 625,489 680,489" class="arrow"/><path d="M552,281 C615,281 620,589 680,589" class="arrow"/><path d="M255,289 C300,289 315,465 372,465" class="arrow"/><path d="M255,374 C300,374 315,530 372,530" class="arrow"/><path d="M255,459 C300,459 315,465 372,465" class="arrow"/><path d="M255,544 C300,544 315,465 372,465" class="arrow"/><path d="M255,629 C300,629 315,465 372,465" class="arrow"/><path d="M552,465 C605,465 625,289 680,289" class="arrow"/><path d="M552,530 C605,530 625,589 680,589" class="arrow"/><path d="M552,595 C600,595 612,389 680,389" class="arrow"/><path d="M552,660 C605,660 625,589 680,589" class="arrow"/><path d="M870,289 C925,289 940,199 995,199" class="arrow"/><path d="M870,289 C925,289 940,299 995,299" class="arrow"/><path d="M870,289 C925,289 940,399 995,399" class="arrow"/><path d="M870,389 C925,389 940,199 995,199" class="arrow"/><path d="M870,389 C925,389 940,299 995,299" class="arrow"/><path d="M870,489 C925,489 94