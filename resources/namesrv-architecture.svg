<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" aria-labelledby="title desc" role="img" viewBox="0 0 1280 780"><title id="title">rocketmq-namesrv architecture</title><desc id="desc">Architecture diagram for the RocketMQ Rust NameServer crate, showing remoting ingress, request processors, route manager selection, route tables, KV configuration, broker housekeeping, inactive broker scans, and optional embedded controller mode.</desc><defs><linearGradient id="titleGradient" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient><filter id="softShadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="10"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px &quot;Segoe UI&quot;,Arial,sans-serif;fill:url(#titleGradient)}.subtitle{font:500 14px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#475569}.label{fill:#0f172a}.section-title{font:700 15px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#0f172a}.label{font:600 13px &quot;Segoe UI&quot;,Arial,sans-serif}.small{font:500 11.5px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.1;filter:url(#softShadow)}.chip-blue{fill:#eff6ff;stroke:#bfdbfe}.chip-amber,.chip-blue,.chip-teal{stroke-width:1}.chip-teal{fill:#ecfdf5;stroke:#a7f3d0}.chip-amber{fill:#fffbeb;stroke:#fde68a}.chip-rose,.chip-violet{stroke-width:1}.chip-violet{fill:#f5f3ff;stroke:#ddd6fe}.chip-rose{fill:#fff1f2;stroke:#fecdd3}.chip-gray,.chip-green{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}.chip-green{fill:#f0fdf4;stroke:#bbf7d0}.arrow,.dash{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.bus{stroke:#94a3b8;stroke-width:1.1;fill:none}</style></defs><rect width="1280" height="780" class="bg"/><text x="54" y="58" class="title">rocketmq-namesrv Architecture</text><text x="54" y="84" class="subtitle">Service discovery and routing core for RocketMQ brokers, clients, admin tools, route tables, KV configuration, and optional controller mode.</text><rect width="218" height="330" x="42" y="124" class="panel" rx="14"/><text x="72" y="157" class="section-title">Ingress Callers</text><rect width="158" height="56" x="72" y="198" class="chip-blue" rx="9"/><text x="96" y="221" class="label">Brokers</text><text x="96" y="238" class="small">register / heartbeat</text><rect width="158" height="56" x="72" y="278" class="chip-teal" rx="9"/><text x="96" y="301" class="label">Clients</text><text x="96" y="318" class="small">topic route lookup</text><rect width="158" height="56" x="72" y="358" class="chip-amber" rx="9"/><text x="96" y="381" class="label">Admin tools</text><text x="96" y="398" class="small">KV, config, permissions</text><rect width="270" height="330" x="320" y="124" class="panel" rx="14"/><text x="350" y="157" class="section-title">Remoting Runtime</text><rect width="210" height="58" x="350" y="198" class="chip-violet" rx="9"/><text x="372" y="221" class="label">RocketMQ remoting server</text><text x="372" y="238" class="small">port 9876 by default</text><rect width="210" height="58" x="350" y="286" class="chip-violet" rx="9"/><text x="372" y="309" class="label">NameServerRequestProcessor</text><text x="372" y="326" class="small">request-code dispatcher</text><rect width="210" height="58" x="350" y="374" class="chip-gray" rx="9"/><text x="372" y="397" class="label">Default fallback</text><text x="372" y="414" class="small">RequestCodeNotSupported</text><rect width="278" height="330" x="650" y="124" class="panel" rx="14"/><text x="680" y="157" class="section-title">Request Processors</text><rect width="218" height="58" x="680" y="198" class="chip-blue" rx="9"/><text x="702" y="221" class="label">ClientRequestProcessor</text><text x="702" y="238" class="small">GetRouteinfoByTopic</text><rect width="218" height="58" x="680" y="286" class="chip-teal" rx="9"/><text x="702" y="309" class="label">ClusterTestRequestProcessor</text><text x="702" y="326" class="small">product-env fallback lookup</text><rect width="218" height="58" x="680" y="374" class="chip-rose" rx="9"/><text x="702" y="397" class="label">DefaultRequestProcessor</text><text x="702" y="414" class="small">broker, topic, KV, config, perms</text><rect width="236" height="330" x="988" y="124" class="panel" rx="14"/><text x="1018" y="157" class="section-title">Route Manager</text><rect width="176" height="58" x="1018" y="198" class="chip-green" rx="9"/><text x="1040" y="221" class="label">RouteInfoManager</text><text x="1040" y="238" class="small">single canonical implementation</text><rect width="176" height="58" x="1018" y="286" class="chip-green" rx="9"/><text x="1040" y="309" class="label">Concurrent state</text><text x="1040" y="326" class="small">DashMap + mutation coordinator</text><rect width="176" height="58" x="1018" y="374" class="chip-gray" rx="9"/><text x="1040" y="397" class="label">Reverse topic index</text><text x="1040" y="414" class="small">consistent broker/topic lookup</text><rect width="1182" height="88" x="42" y="508" class="panel" rx="14"/><text x="72" y="540" class="section-title">Route Tables</text><rect width="188" height="26" x="72" y="560" class="chip-blue" rx="7"/><text x="105" y="577" class="small">topic queue table</text><rect width="188" height="26" x="282" y="560" class="chip-teal" rx="7"/><text x="327" y="577" class="small">broker table</text><rect width="188" height="26" x="492" y="560" class="chip-amber" rx="7"/><text x="535" y="577" class="small">cluster table</text><rect width="188" height="26" x="702" y="560" class="chip-rose" rx="7"/><text x="746" y="577" class="small">live broker table</text><rect width="188" height="26" x="912" y="560" class="chip-violet" rx="7"/><text x="944" y="577" class="small">filter-server table</text><rect width="1182" height="94" x="42" y="634" class="panel" rx="14"/><text x="72" y="665" class="section-title">Runtime Support Services</text><rect width="246" height="28" x="72" y="686" class="chip-amber" rx="7"/><text x="94" y="704" class="small">KVConfigManager: KV persistence</text><rect width="246" height="28" x="342" y="686" class="chip-blue" rx="7"/><text x="364" y="704" class="small">BrokerHousekeeping: channel events</text><rect width="246" height="28" x="612" y="686" class="chip-green" rx="7"/><text x="634" y="704" class="small">Scheduled scans: inactive broker cleanup</text><rect width="246" height="28" x="882" y="686" class="chip-violet" rx="7"/><text x="904" y="704" class="small">ControllerManager: embedded mode</text><path d="M230 226 H350" class="arrow"/><path d="M230 306 C272 306 292 227 350 227" class="arrow"/><path d="M230 386 C272 386 292 316 350 316" class="arrow"/><path d="M455 256 V286" class="arrow"/><path d="M560 315 H680" class="arrow"/><path d="M560 315 C610 315 628 227 680 227" class="arrow"/><path d="M560 315 C610 315 628 403 680 403" class="arrow"/><path d="M898 227 H1018" class="arrow"/><path d="M898 315 H1018" class="arrow"/><path d="M898 403 H1018" class="arrow"/><path d="M1106 256 V286" class="arrow"/><path d="M1106 344 V374" class="dash"/><path d="M1106 432 V508" class="arrow"/><path d="M166 454 V508" class="bus"/><path d="M455 454 V508" class="bus"/><path d="M789 454 V508" class="bus"/><path d="M1110 454 V508" class="bus"/><path d="M633 596 V634" class="arrow"/><path d="M195 634 C195 612 175 604 166 586" class="dash"/><path d="M465 634 C465 612 385 604 376 586" class="dash"/><path d="M735 634 C735 612 805 604 796 586" class="dash"/><path d="M1005 634 C1005 612 1006 604 1006 586" class="dash"/></svg>