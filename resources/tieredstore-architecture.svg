<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1280 720"><title id="title">rocketmq-tieredstore architecture</title><desc id="desc">Architecture diagram for the RocketMQ Rust tieredstore crate, showing broker dispatch integration, TieredStore composition, dispatcher and fetcher paths, flat files, metadata, providers, and background services.</desc><defs><linearGradient id="titleGradient" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient><filter id="softShadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="10"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px &quot;Segoe UI&quot;,Arial,sans-serif;fill:url(#titleGradient)}.subtitle{font:500 14px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.1;filter:url(#softShadow)}.label{fill:#0f172a}.section-title{font:700 15px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#0f172a}.label{font:650 13px &quot;Segoe UI&quot;,Arial,sans-serif}.small{font:500 11.5px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#475569}.tiny{font:500 10.5px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#64748b}.chip-blue{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1}.chip-amber,.chip-teal{stroke-width:1;fill:#ecfdf5;stroke:#a7f3d0}.chip-amber{fill:#fffbeb;stroke:#fde68a}.chip-violet{fill:#f5f3ff;stroke:#ddd6fe}.chip-gray,.chip-rose,.chip-violet{stroke-width:1}.chip-rose{fill:#fff1f2;stroke:#fecdd3}.chip-gray{fill:#f1f5f9;stroke:#cbd5e1}.arrow,.dash{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.bus{stroke:#94a3b8;stroke-width:1.1;fill:none}</style></defs><rect width="1280" height="720" class="bg"/><text x="54" y="54" class="title">rocketmq-tieredstore Architecture</text><text x="54" y="80" class="subtitle">A tiered storage layer for RocketMQ Rust with async dispatch, logical fetch, metadata recovery, and pluggable segment providers</text><rect width="226" height="424" x="42" y="124" class="panel" rx="12"/><text x="70" y="158" class="section-title">RocketMQ Store Side</text><rect width="166" height="46" x="72" y="188" class="chip-blue" rx="8"/><text x="91" y="208" class="label">CommitLog dispatch</text><text x="92" y="225" class="small">message body and offsets</text><rect width="166" height="46" x="72" y="254" class="chip-blue" rx="8"/><text x="91" y="274" class="label">TieredCommitLogDispatcher</text><text x="92" y="291" class="small">rocketmq-store adapter</text><rect width="166" height="46" x="72" y="320" class="chip-blue" rx="8"/><text x="91" y="340" class="label">TieredDispatchRequest</text><text x="92" y="357" class="small">topic, queue, body, keys</text><rect width="166" height="46" x="72" y="386" class="chip-blue" rx="8"/><text x="91" y="406" class="label">Fetch fallback</text><text x="92" y="423" class="small">offset/time/key queries</text><rect width="166" height="46" x="72" y="452" class="chip-blue" rx="8"/><text x="91" y="472" class="label">Storage level policy</text><text x="92" y="489" class="small">Disable, NotInDisk, Force</text><rect width="246" height="438" x="318" y="110" class="panel" rx="12"/><text x="346" y="144" class="section-title">TieredStore Composition</text><rect width="186" height="52" x="348" y="174" class="chip-teal" rx="8"/><text x="368" y="195" class="label">TieredStoreConfig</text><text x="368" y="212" class="small">segment sizes and policies</text><rect width="186" height="52" x="348" y="248" class="chip-teal" rx="8"/><text x="368" y="269" class="label">JsonMetadataStore</text><text x="368" y="286" class="small">topics, queues, segments, index</text><rect width="186" height="52" x="348" y="322" class="chip-teal" rx="8"/><text x="368" y="343" class="label">TieredFlatFileStore</text><text x="368" y="360" class="small">topic/queue flat files</text><rect width="186" height="52" x="348" y="396" class="chip-teal" rx="8"/><text x="368" y="417" class="label">Dispatcher and Fetcher</text><text x="368" y="434" class="small">write queue and read API</text><rect width="186" height="52" x="348" y="470" class="chip-teal" rx="8"/><text x="368" y="491" class="label">Lifecycle</text><text x="368" y="508" class="small">load, start, shutdown, destroy</text><rect width="282" height="228" x="614" y="110" class="panel" rx="12"/><text x="642" y="144" class="section-title">Write Path</text><rect width="108" height="48" x="642" y="174" class="chip-amber" rx="8"/><text x="663" y="194" class="label">Dispatcher</text><text x="658" y="211" class="small">bounded mpsc</text><rect width="104" height="48" x="764" y="174" class="chip-amber" rx="8"/><text x="786" y="194" class="label">Validation</text><text x="779" y="211" class="small">body and size</text><rect width="108" height="48" x="642" y="244" class="chip-amber" rx="8"/><text x="661" y="264" class="label">CommitLog</text><text x="657" y="281" class="small">message bytes</text><rect width="104" height="48" x="764" y="244" class="chip-amber" rx="8"/><text x="781" y="264" class="label">ConsumeQueue</text><text x="785" y="281" class="small">20-byte units</text><rect width="226" height="18" x="642" y="306" class="chip-amber" rx="6"/><text x="688" y="319" class="tiny">commit metadata and append index entries</text><rect width="282" height="168" x="614" y="380" class="panel" rx="12"/><text x="642" y="414" class="section-title">Read Path</text><rect width="108" height="48" x="642" y="444" class="chip-violet" rx="8"/><text x="668" y="464" class="label">Fetcher</text><text x="656" y="481" class="small">queue offset reads</text><rect width="104" height="48" x="764" y="444" class="chip-violet" rx="8"/><text x="792" y="464" class="label">Index</text><text x="780" y="481" class="small">key and uniq key</text><rect width="226" height="24" x="642" y="506" class="chip-violet" rx="6"/><text x="677" y="522" class="tiny">timestamp boundary lookup and read-ahead limits</text><rect width="296" height="438" x="940" y="110" class="panel" rx="12"/><text x="968" y="144" class="section-title">Segments, Providers, Services</text><rect width="108" height="52" x="970" y="174" class="chip-gray" rx="8"/><text x="992" y="195" class="label">FileSegment</text><text x="987" y="212" class="small">append, commit, read</text><rect width="106" height="52" x="1100" y="174" class="chip-gray" rx="8"/><text x="1120" y="195" class="label">Metadata</text><text x="1116" y="212" class="small">JSON checkpoint</text><rect width="108" height="52" x="970" y="250" class="chip-gray" rx="8"/><text x="996" y="271" class="label">POSIX</text><text x="991" y="288" class="small">durable files</text><rect width="106" height="52" x="1100" y="250" class="chip-gray" rx="8"/><text x="1123" y="271" class="label">Memory</text><text x="1114" y="288" class="small">tests and examples</text><rect width="108" height="52" x="970" y="326" class="chip-gray" rx="8"/><text x="989" y="347" class="label">Recovery</text><text x="986" y="364" class="small">metadata reconcile</text><rect width="106" height="52" x="1100" y="326" class="chip-gray" rx="8"/><text x="1124" y="347" class="label">Cleanup</text><text x="1118" y="364" class="small">retention policy</text><rect width="236" height="52" x="970" y="402" class="chip-rose" rx="8"/><text x="1002" y="423" class="label">Integration feature</text><text x="993" y="440" class="small">rocketmq-store-integration adapter boundary</text><rect width="236" height="36" x="970" y="478" class="chip-gray" rx="8"/><text x="992" y="500" class="small">paths: topic / queue / segment-type / base-offset</text><path d="M238 343 C282 343 292 348 348 348" class="arrow"/><path d="M534 422 C570 422 588 198 642 198" class="arrow"/><path d="M750 198 C754 198 758 198 764 198" class="arrow"/><path d="M696 222 C696 232 696 238 696 244" class="arrow"/><path d="M816 222 C816 232 816 238 816 244" class="arrow"/><path d="M868 268 C908 268 930 200 970 200" class="arrow"/><path d="M868 315 C934 315 1002 292 1024 250" class="arrow"/><path d="M534 422 C570 422 588 468 642 468" class="arrow"/><path d="M750 468 C754 468 758 468 764 468" class="arrow"/><path d="M816 444 C854 380 918 352 970 352" class="arrow"/><path d="M1078 200 C1088 200 1092 200 1100 200" class="arrow"/><path d="M1078 276 C1088 276 1092 276 1100 276" class="arrow"/><path d="M441 248 C575 92 940 82 1154 174" class="dash"/><path d="M441 470 C640 636 1076 614 1153 378" class="dash"/><path d="M155 498 C220 560 620 566 914 562 C1080 560 1150 540 1176 514" class="bus"/><rect width="1194" height="76" x="42" y="590" class="panel" rx="12"/><text x="72" y="616" class="section-title">Operational Flow</text><text x="72" y="639" class="small">Writes are accepted as TieredDispatchRequest values, persisted into CommitLog and ConsumeQueue segments, then indexed by message keys.</text><text x="72" y="657" class="small">Reads resolve queue offsets, timestamps, or keys back to segment ranges; lifecycle services recover metadata and remove expired segments.</text></svg>