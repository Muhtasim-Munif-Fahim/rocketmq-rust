<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1280 720"><title id="title">rocketmq-admin-cli architecture</title><desc id="desc">Architecture diagram for the RocketMQ Rust admin CLI crate, showing shell input, Clap parsing, Java-compatible argument normalization, command domains, core service delegation, admin transport, output rendering, prompts, progress display, and completion generation.</desc><defs><linearGradient id="titleGradient" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient><filter id="softShadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="10"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px &quot;Segoe UI&quot;,Arial,sans-serif;fill:url(#titleGradient)}.subtitle{font:500 14px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.1;filter:url(#softShadow)}.label{fill:#0f172a}.section-title{font:700 15px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#0f172a}.label{font:650 13px &quot;Segoe UI&quot;,Arial,sans-serif}.small{font:500 11.5px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#475569}.tiny{font:500 10.5px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#64748b}.chip-blue{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1}.chip-amber,.chip-teal{stroke-width:1;fill:#ecfdf5;stroke:#a7f3d0}.chip-amber{fill:#fffbeb;stroke:#fde68a}.chip-violet{fill:#f5f3ff;stroke:#ddd6fe}.chip-gray,.chip-rose,.chip-violet{stroke-width:1}.chip-rose{fill:#fff1f2;stroke:#fecdd3}.chip-gray{fill:#f1f5f9;stroke:#cbd5e1}.arrow,.dash{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.bus{stroke:#94a3b8;stroke-width:1.1;fill:none}</style></defs><rect width="1280" height="720" class="bg"/><text x="54" y="54" class="title">rocketmq-admin-cli Architecture</text><text x="54" y="80" class="subtitle">Command-line adapter for RocketMQ administration, Java-compatible command names, shared core services, and terminal rendering</text><rect width="214" height="438" x="42" y="122" class="panel" rx="12"/><text x="70" y="156" class="section-title">Operator Entry Points</text><rect width="154" height="46" x="72" y="184" class="chip-blue" rx="8"/><text x="93" y="204" class="label">Shell command</text><text x="93" y="221" class="small">rocketmq-admin-cli</text><rect width="154" height="46" x="72" y="250" class="chip-blue" rx="8"/><text x="93" y="270" class="label">Help and show</text><text x="93" y="287" class="small">command catalog</text><rect width="154" height="46" x="72" y="316" class="chip-blue" rx="8"/><text x="93" y="336" class="label">Completion</text><text x="93" y="353" class="small">bash, zsh, fish</text><rect width="154" height="46" x="72" y="382" class="chip-blue" rx="8"/><text x="93" y="402" class="label">NameServer</text><text x="93" y="419" class="small">-n / --namesrvAddr</text><rect width="154" height="46" x="72" y="448" class="chip-blue" rx="8"/><text x="93" y="468" class="label">Safety flags</text><text x="93" y="485" class="small">--yes, prompts</text><rect width="248" height="438" x="300" y="122" class="panel" rx="12"/><text x="328" y="156" class="section-title">CLI Adapter</text><rect width="188" height="50" x="330" y="184" class="chip-teal" rx="8"/><text x="352" y="205" class="label">RocketMQCli</text><text x="352" y="222" class="small">clap parser and root command</text><rect width="188" height="50" x="330" y="254" class="chip-teal" rx="8"/><text x="352" y="275" class="label">Java compatibility</text><text x="352" y="292" class="small">normalizes legacy flags</text><rect width="188" height="50" x="330" y="324" class="chip-teal" rx="8"/><text x="352" y="345" class="label">CommandExecute</text><text x="352" y="362" class="small">domain dispatch trait</text><rect width="188" height="50" x="330" y="394" class="chip-teal" rx="8"/><text x="352" y="415" class="label">Command modules</text><text x="352" y="432" class="small">96 Java-compatible commands</text><rect width="188" height="50" x="330" y="464" class="chip-teal" rx="8"/><text x="352" y="485" class="label">Tokio runtime</text><text x="352" y="502" class="small">dedicated CLI main thread</text><rect width="306" height="250" x="592" y="112" class="panel" rx="12"/><text x="620" y="146" class="section-title">Command Domains</text><rect width="116" height="42" x="620" y="174" class="chip-amber" rx="8"/><text x="644" y="199" class="label">topic</text><rect width="116" height="42" x="754" y="174" class="chip-amber" rx="8"/><text x="778" y="199" class="label">broker</text><rect width="116" height="42" x="620" y="228" class="chip-amber" rx="8"/><text x="644" y="253" class="label">consumer</text><rect width="116" height="42" x="754" y="228" class="chip-amber" rx="8"/><text x="778" y="253" class="label">message</text><rect width="116" height="42" x="620" y="282" class="chip-amber" rx="8"/><text x="644" y="307" class="label">auth</text><rect width="116" height="42" x="754" y="282" class="chip-amber" rx="8"/><text x="778" y="307" class="label">export</text><rect width="250" height="16" x="620" y="336" class="chip-amber" rx="6"/><text x="646" y="348" class="tiny">cluster, controller, nameserver, offset, queue, lite, ha, stats, connection, container, producer</text><rect width="306" height="158" x="592" y="402" class="panel" rx="12"/><text x="620" y="436" class="section-title">Terminal Output</text><rect width="76" height="42" x="620" y="464" class="chip-violet" rx="8"/><text x="644" y="489" class="label">table</text><rect width="76" height="42" x="710" y="464" class="chip-violet" rx="8"/><text x="737" y="489" class="label">json</text><rect width="70" height="42" x="800" y="464" class="chip-violet" rx="8"/><text x="824" y="489" class="label">yaml</text><rect width="250" height="22" x="620" y="522" class="chip-violet" rx="6"/><text x="650" y="537" class="tiny">colored status, confirmation prompts, progress bars</text><rect width="296" height="438" x="940" y="122" class="panel" rx="12"/><text x="968" y="156" class="section-title">Shared Admin Stack</text><rect width="236" height="52" x="970" y="184" class="chip-gray" rx="8"/><text x="1000" y="205" class="label">rocketmq-admin-core</text><text x="1000" y="222" class="small">request DTOs and reusable services</text><rect width="236" height="52" x="970" y="262" class="chip-gray" rx="8"/><text x="1000" y="283" class="label">DefaultMQAdminExt</text><text x="1000" y="300" class="small">admin operations and routing</text><rect width="236" height="52" x="970" y="340" class="chip-gray" rx="8"/><text x="1000" y="361" class="label">rocketmq-remoting</text><text x="1000" y="378" class="small">NameServer and broker RPC</text><rect width="236" height="52" x="970" y="418" class="chip-gray" rx="8"/><text x="1000" y="439" class="label">RocketMQ cluster</text><text x="1000" y="456" class="small">NameServer, broker, controller</text><rect width="236" height="36" x="970" y="496" class="chip-rose" rx="8"/><text x="998" y="518" class="small">TUI and future GUI depend on core, not CLI</text><path d="M226 207 C262 207 286 207 330 207" class="arrow"/><path d="M226 339 C272 339 296 279 330 279" class="arrow"/><path d="M518 349 C552 349 576 249 620 249" class="arrow"/><path d="M518 419 C552 419 576 485 620 485" class="arrow"/><path d="M870 249 C906 249 928 210 970 210" class="arrow"/><path d="M1088 236 C1088 246 1088 252 1088 262" class="arrow"/><path d="M1088 314 C1088 324 1088 330 1088 340" class="arrow"/><path d="M1088 392 C1088 402 1088 408 1088 418" class="arrow"/><path d="M226 471 C418 620 736 620 970 514" class="dash"/><path d="M424 254 C516 88 1030 82 1088 184" class="dash"/><path d="M745 544 C704 590 420 592 154 520" class="bus"/><rect width="1194" height="76" x="42" y="604" class="panel" rx="12"/><text x="72" y="630" class="section-title">Command Flow</text><text x="72" y="653" class="small">Shell arguments are normalized for Java-compatible options, parsed by Clap, and routed to a command-domain executor.</text><text x="72" y="671" class="small">Executors build admin-core request DTOs, call shared admin services, then render table, JSON, YAML, status, progress, or completion output.</text></svg>