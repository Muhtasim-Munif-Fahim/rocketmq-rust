<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" aria-labelledby="title desc" role="img" viewBox="0 0 1280 780"><title id="title">rocketmq-remoting architecture</title><desc id="desc">Architecture diagram for the RocketMQ Rust remoting crate, showing protocol models, codec and transport, client runtime, server runtime, processor dispatch, TLS, observability, and external RocketMQ integrations.</desc><defs><linearGradient id="titleGradient" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient><filter id="softShadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="10"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px &quot;Segoe UI&quot;,Arial,sans-serif;fill:url(#titleGradient)}.subtitle{font:500 14px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#475569}.label{fill:#0f172a}.section-title{font:700 15px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#0f172a}.label{font:600 13px &quot;Segoe UI&quot;,Arial,sans-serif}.small{font:500 11.5px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.1;filter:url(#softShadow)}.chip-blue{fill:#eff6ff;stroke:#bfdbfe}.chip-teal{fill:#ecfdf5;stroke:#a7f3d0}.chip-amber{fill:#fffbeb;stroke:#fde68a}.chip-violet{fill:#f5f3ff;stroke:#ddd6fe}.chip-gray{fill:#f1f5f9;stroke:#cbd5e1}.arrow,.dash{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.bus{stroke:#94a3b8;stroke-width:1.1;fill:none}</style></defs><rect width="1280" height="780" class="bg"/><text x="54" y="54" class="title">rocketmq-remoting Runtime Architecture</text><text x="54" y="80" class="subtitle">Protocol models, wire co