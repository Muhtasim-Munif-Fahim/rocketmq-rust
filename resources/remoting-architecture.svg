rtbeat</text><text x="342" y="475" class="small">topic, subscription, static</text><rect width="182" height="64" x="320" y="530" class="chip-amber" rx="8"/><text x="342" y="555" class="label">Serde Surface</text><text x="342" y="573" class="small">JSON, fast headers, SIMD</text><rect width="288" height="534" x="574" y="112" class="panel" rx="14"/><text x="602" y="145" class="section-title">Codec + Transport Core</text><line x1="602" x2="834" y1="161" y2="161" class="bus"/><rect width="228" height="64" x="604" y="182" class="chip-violet" rx="9"/><text x="626" y="207" class="label">RemotingCommandCodec</text><text x="626" y="225" class="small">Tokio encoder / decoder</text><rect width="228" height="64" x="604" y="268" class="chip-violet" rx="9"/><text x="626" y="293" class="label">CompositeCodec</text><text x="626" y="311" class="small">command decode, bytes encode</text><rect width="228" height="64" x="604" y="354" class="chip-violet" rx="9"/><text x="626" y="379" class="label">Connection + Channel</text><text x="626" y="397" class="small">framing, send, receive</text><rect width="228" height="64" x="604" y="440" class="chip-violet" rx="9"/><text x="626" y="465" class="label">TLS Runtime</text><text x="626" y="483" class="small">disabled, permissive, enforcing</text><rect width="228" height="64" x="604" y="526" class="chip-violet" rx="9"/><text x="626" y="551" class="label">Smart Encode Buffer</text><text x="626" y="569" class="small">adaptive allocation control</text><rect width="324" height="246" x="904" y="112" class="panel" rx="14"/><text x="932" y="145" class="section-title">Client Runtime</text><rect width="124" height="54" x="932" y="174" class="chip-blue" rx="8"/><text x="950" y="197" class="label">DefaultClient</text><text x="950" y="215" class="small">async RPC</text><rect width="120" height="54" x="1080" y="174" class="chip-blue" rx="8"/><text x="1098" y="197" class="label">Response Table</text><text x="1098" y="215" class="small">opaque future</text><rect width="124" height="54" x="932" y="254" class="chip-blue" rx="8"/><text x="950" y="277" class="label">NameServer</text><text x="950" y="295" class="small">latency selector</text><rect width="120" height="54" x="1080" y="254" class="chip-blue" rx="8"/><text x="1098" y="277" class="label">Pool + Retry</text><text x="1098" y="295" class="small">circuit breaker</text><rect width="324" height="246" x="904" y="400" class="panel" rx="14"/><text x="932" y="433" class="section-title">Server Runtime</text><rect width="124" height="54" x="932" y="462" class="chip-amber" rx="8"/><text x="950" y="485" class="label">TcpListener</text><text x="950" y="503" class="small">accept loop</text><rect width="120" height="54" x="1080" y="462" class="chip-amber" rx="8"/><text x="1098" y="485" class="label">ConnectionTask</text><text x="1098" y="503" class="small">idle + shutdown</text><rect width="124" height="54" x="932" y="542" class="chip-amber" rx="8"/><text x="950" y="565" class="label">Processor</text><text x="950" y="583" class="small">RequestProcessor</text><rect width="120" height="54" x="1080" y="542" class="chip-amber" rx="8"/><text x="1098" y="565" class="label">Processor V2</text><text x="1098" y="583" class="small">core + plugin</text><rect width="936" height="56" x="292" y="684" class="panel" rx="12"/><text x="320" y="716" class="section-title">Cross-cutting: RPCHook, channel events, reconnect backoff, observability metrics, protocol compatibility tests, benchmarks</text><path d="M224 204 H318" class="arrow"/><path d="M224 284 H318" class="arrow"/><path d="M224 364 H318" class="arrow"/><path d="M224 444 H318" class="arrow"/><path d="M502 206 H602" class="arrow"/><path d="M502 292 H602" class="arrow"/><path d="M502 378 H602" class="arrow"/><path d="M502 562 H602" class="arrow"/><path d="M832 214 H932" class="arrow"/><path d="M832 386 H932" class="arrow"/><path d="M832 472 H932" class="arrow"/><path d="M1060 228 V254" class="dash"/><path d="M1060 516 V542" class="dash"/><path 