<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1280 720"><title id="title">rocketmq-store architecture</title><desc id="desc">Architecture diagram for the RocketMQ Rust store crate, showing the MessageStore boundary, local file and RocksDB implementations, commit log, consume queue, index, timer, HA, observability, and tiered storage extensions.</desc><defs><linearGradient id="titleGradient" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient><filter id="softShadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="10"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px &quot;Segoe UI&quot;,Arial,sans-serif;fill:url(#titleGradient)}.subtitle{font:500 14px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.1;filter:url(#softShadow)}.label{fill:#0f172a}.section-title{font:700 15px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#0f172a}.label{font:650 13px &quot;Segoe UI&quot;,Arial,sans-serif}.small{font:500 11.5px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#475569}.tiny{font:500 10.5px &quot;Segoe UI&quot;,Arial,sans-serif;fill:#64748b}.chip-blue{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1}.chip-amber,.chip-teal{stroke-width:1;fill:#ecfdf5;stroke:#a7f3d0}.chip-amber{fill:#fffbeb;stroke:#fde68a}.chip-violet{fill:#f5f3ff;stroke:#ddd6fe}.chip-gray,.chip-rose,.chip-violet{stroke-width:1}.chip-rose{fill:#fff1f2;stroke:#fecdd3}.chip-gray{fill:#f1f5f9;stroke:#cbd5e1}.arrow,.dash{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.bus{stroke:#94a3b8;stroke-width:1.1;fill:none}</style></defs><rect width="1280" height="720" class="bg"/><text x="54" y="54" class="title">rocketmq-store Architecture</text><text x="54" y="80" class="subtitle">Storage boundary for RocketMQ Rust: CommitLog, ConsumeQueue, index, timer, HA, RocksDB metadata, and optional tiered storage</text><rect width="214" height="438" x="42" y="122" class="panel" rx="12"/><text x="68" y="156" class="section-title">Store Consumers</text><rect width="162" height="46" x="68" y="184" class="chip-blue" rx="8"/><text x="88" y="204" class="label">rocketmq-broker</text><text x="88" y="221" class="small">put, pull, query, offsets</text><rect width="162" height="46" x="68" y="250" class="chip-blue" rx="8"/><text x="88" y="270" class="label">Admin paths</text><text x="88" y="287" class="small">runtime info and cleanup</text><rect width="162" height="46" x="68" y="316" class="chip-blue" rx="8"/><text x="88" y="336" class="label">Replication</text><text x="88" y="353" class="small">master, slave, controller</text><rect width="162" height="46" x="68" y="382" class="chip-blue" rx="8"/><text x="88" y="402" class="label">Delay and POP</text><text x="88" y="419" class="small">timer, ack checkpoints</text><rect width="162" height="46" x="68" y="448" class="chip-blue" rx="8"/><text x="88" y="468" class="label">Observability</text><text x="88" y="485" class="small">stats and optional metrics</text><rect width="246" height="438" x="300" y="122" class="panel" rx="12"/><text x="328" y="156" class="section-title">Public Boundary</text><rect width="186" height="58" x="330" y="184" class="chip-teal" rx="8"/><text x="354" y="205" class="label">MessageStore trait</text><text x="354" y="222" class="small">load, start, shutdown</text><text x="354" y="237" class="tiny">put, get, query, offsets, HA</text><rect width="186" height="58" x="330" y="270" class="chip-teal" rx="8"/><text x="354" y="291" class="label">GenericMessageStore</text><text x="354" y="308" class="small">LocalFileStore variant</text><text x="354" y="323" class="tiny">RocksDBStore with feature flag</text><rect width="186" height="58" x="330" y="356" class="chip-teal" rx="8"/><text x="354" y="377" class="label">MessageStoreConfig</text><text x="354" y="394" class="small">store paths and flush policy</text><text x="354" y="409" class="tiny">store_type, timer, HA, RocksDB</text><rect width="186" height="58" x="330" y="442" class="chip-teal" rx="8"/><text x="354" y="463" class="label">StoreError</text><text x="354" y="480" class="small">typed store failures</text><text x="354" y="495" class="tiny">HA and RocksDB adapters</text><rect width="322" height="262" x="592" y="112" class="panel" rx="12"/><text x="620" y="146" class="section-title">Local File Message Store</text><rect width="122" height="54" x="620" y="174" class="chip-amber" rx="8"/><text x="648" y="195" class="label">CommitLog</text><text x="642" y="212" class="small">append-only files</text><rect width="120" height="54" x="766" y="174" class="chip-amber" rx="8"/><text x="791" y="195" class="label">MappedFile</text><text x="787" y="212" class="small">mmap and IO hints</text><rect width="122" height="54" x="620" y="254" class="chip-amber" rx="8"/><text x="643" y="275" class="label">FlushManager</text><text x="635" y="292" class="small">sync and async flush</text><rect width="120" height="54" x="766" y="254" class="chip-amber" rx="8"/><text x="793" y="275" class="label">Checkpoint</text><text x="789" y="292" class="small">recovery positions</text><rect width="266" height="32" x="620" y="326" class="chip-amber" rx="8"/><text x="652" y="347" class="small">fast-load parallel CommitLog loading by default</text><rect width="282" height="262" x="954" y="112" class="panel" rx="12"/><text x="982" y="146" class="section-title">RocksDB Store Feature</text><rect width="102" height="54" x="982" y="174" class="chip-violet" rx="8"/><text x="1002" y="195" class="label">CQ CFs</text><text x="1002" y="212" class="small">queue offsets</text><rect width="106" height="54" x="1100" y="174" class="chip-violet" rx="8"/><text x="1121" y="195" class="label">Message CFs</text><text x="1115" y="212" class="small">index, timer, trans</text><rect width="102" height="54" x="982" y="254" class="chip-violet" rx="8"/><text x="1005" y="275" class="label">Batch writer</text><text x="1001" y="292" class="small">metadata writes</text><rect width="106" height="54" x="1100" y="254" class="chip-violet" rx="8"/><text x="1123" y="275" class="label">Maintenance</text><text x="1119" y="292" class="small">flush, compact</text><rect width="224" height="32" x="982" y="326" class="chip-violet" rx="8"/><text x="1004" y="347" class="small">reuses local CommitLog, stores metadata in RocksDB</text><rect width="644" height="164" x="592" y="416" class="panel" rx="12"/><text x="620" y="449" class="section-title">Derived Indexes and Background Services</text><rect width="110" height="46" x="620" y="478" class="chip-gray" rx="8"/><text x="642" y="498" class="label">ConsumeQueue</text><text x="643" y="515" class="small">logical offsets</text><rect width="104" height="46" x="746" y="478" class="chip-gray" rx="8"/><text x="776" y="498" class="label">Index</text><text x="766" y="515" class="small">key lookup</text><rect width="104" height="46" x="866" y="478" class="chip-gray" rx="8"/><text x="893" y="498" class="label">Timer</text><text x="882" y="515" class="small">delayed messages</text><rect width="104" height="46" x="986" y="478" class="chip-gray" rx="8"/><text x="1012" y="498" class="label">HA</text><text x="1003" y="515" class="small">replication</text><rect width="104" height="46" x="1106" y="478" class="chip-gray" rx="8"/><text x="1129" y="498" class="label">Stats</text><text x="1122" y="515" class="small">broker metrics</text><rect width="590" height="22" x="620" y="542" class="chip-rose" rx="6"/><text x="664" y="557" class="tiny">Optional extensions: tieredstore dispatcher, observability metrics, io_uring mapped-file backend on Linux</text><path d="M230 206 C258 206 270 206 300 206" class="arrow"/><path d="M516 213 C552 213 558 201 620 201" class="arrow"/><path d="M516 299 C570 299 570 282 620 282" class="arrow"/><path d="M742 201 C752 201 756 201 766 201" class="arrow"/><path d="M742 282 C752 282 756 282 766 282" class="arrow"/><path d="M886 201 C922 201 940 201 982 201" class="arrow"/><path d="M742 342 C704 396 686 440 675 478" class="arrow"/><path d="M753 342 C769 392 786 430 798 478" class="arrow"/><path d="M764 342 C828 391 886 421 918 478" class="arrow"/><path d="M826 282 C920 348 1000 394 1038 478" class="arrow"/><path d="M1084 281 C1090 350 1108 400 1158 478" class="dash"/><path d="M149 494 C210 552 620 572 915 568 C1094 566 1162 548 1180 564" class="bus"/><path d="M149 494 C220 590 300 600 423 500" class="dash"/><rect width="1194" height="76" x="42" y="604" class="panel" rx="12"/><text x="72" y="631" class="section-title">Write and Read Flow</text><text x="72" y="654" class="small">Writes append encoded messages to CommitLog, then dispatch metadata to ConsumeQueue, index, timer, compaction, RocksDB, and optional tiered storage.</text><text x="72" y="672" class="small">Reads use logical queues or key indexes to resolve CommitLog offsets and return selected buffers or decoded messages.</text></svg>